<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - ResearchPortal</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    rgba(18, 25, 102, 0.85),
                    rgba(40, 53, 147, 0.9)
                ),
                url("/static/hero3.jpg")
                center / cover no-repeat;
        }

        .auth-container {
            width: 420px;
            max-width: 90%;

            background: rgba(255, 255, 255, 0.97);

            padding: 45px;

            border-radius: 20px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.3);

            text-align: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: #1a237e;

            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;

            font-weight: 600;
            color: #333;
        }

        .form-group input {
            width: 100%;

            padding: 13px 15px;

            border: 1px solid #ddd;

            border-radius: 10px;

            outline: none;

            font-size: 15px;
        }

        .form-group input:focus {
            border-color: #00bcd4;
            box-shadow:
                0 0 0 3px rgba(0, 188, 212, 0.12);
        }

        .auth-button {
            width: 100%;

            padding: 13px;

            border: none;
            border-radius: 10px;

            background: #00bcd4;
            color: white;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;
        }

        .auth-button:hover {
            background: #0097a7;
            transform: translateY(-2px);
        }

        .error {
            background: #ffe8e8;
            color: #c62828;

            padding: 10px;

            border-radius: 8px;

            margin-bottom: 20px;

            font-size: 14px;
        }

        .switch {
            margin-top: 25px;

            color: #666;
        }

        .switch a {
            color: #1a237e;

            font-weight: 600;

            text-decoration: none;
        }

        .switch a:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

    <div class="auth-container">

        <div class="logo">
            ResearchPortal
        </div>

        <p class="subtitle">
            Sign in to analyze your research papers
        </p>

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}

        <form
            method="POST"
            action="{{ url_for('login') }}"
        >

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                    autocomplete="username"
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >

            </div>

            <button
                type="submit"
                class="auth-button"
            >
                Login
            </button>

        </form>

        <div class="switch">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Create Account
            </a>

        </div>

    </div>

</body>

</html>
